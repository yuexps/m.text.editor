name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布 Release 并更新 FnDepot'
        required: true
        default: false
        type: boolean

env:
  TZ: Asia/Shanghai
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(grep "^version" build/manifest | awk -F'"' '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Install fnpack
        run: |
          chmod +x build/fnpack-1.2.1-linux-amd64
          sudo cp build/fnpack-1.2.1-linux-amd64 /usr/local/bin/fnpack

      - name: Build and Pack x86 fpk
        run: |
          sed -i 's/platform.*/platform              = "x86"/g' build/manifest
          cd src
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/app/server/m-text-editor .
          cd ..
          cd build
          fnpack build
          cd ..
          mv build/m.text.editor.fpk ./m.text.editor-${{ steps.manifest.outputs.version }}-x86.fpk

      - name: Build and Pack arm fpk
        run: |
          sed -i 's/platform.*/platform              = "arm"/g' build/manifest
          cd src
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/app/server/m-text-editor .
          cd ..
          cd build
          fnpack build
          cd ..
          mv build/m.text.editor.fpk ./m.text.editor-${{ steps.manifest.outputs.version }}-arm.fpk

      - name: Upload x86 fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: m.text.editor-${{ steps.manifest.outputs.version }}-x86
          path: m.text.editor-${{ steps.manifest.outputs.version }}-x86.fpk
          retention-days: 30

      - name: Upload arm fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: m.text.editor-${{ steps.manifest.outputs.version }}-arm
          path: m.text.editor-${{ steps.manifest.outputs.version }}-arm.fpk
          retention-days: 30

      - name: Package Chrome Extension
        run: |
          zip -r chrome_extension.zip chrome_extension

      - name: Generate changelog
        id: changelog
        if: ${{ inputs.publish }}
        run: |
          TAG="v${{ steps.manifest.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="$TAG" 2>/dev/null || echo "")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- %H %s" >> $GITHUB_OUTPUT
          else
            git log --pretty=format:"- %H %s" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clean existing release and tag
        if: ${{ inputs.publish }}
        run: |
          TAG="v${{ steps.manifest.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已经存在，正在删除..."
            gh release delete "$TAG" --yes
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Git Tag $TAG 已经存在，正在删除远端 Tag..."
            git push origin :refs/tags/"$TAG"
          fi

      - name: Create release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          name: v${{ steps.manifest.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            m.text.editor-*-x86.fpk
            m.text.editor-*-arm.fpk
            chrome_extension.zip
          draft: false
          prerelease: false

      - name: Update FnDepot fnpack.json
        if: ${{ inputs.publish || github.event.inputs.publish == 'true' || github.event.inputs.publish == true }}
        env:
          FnDepot_TOKEN: ${{ secrets.FnDepot_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
          TAG_NAME: v${{ steps.manifest.outputs.version }}
        run: |
          if [ -z "$FnDepot_TOKEN" ]; then
            echo "未配置 FnDepot_TOKEN secret，跳过更新 FnDepot。"
            exit 0
          fi

          FPK_X86="m.text.editor-${VERSION}-x86.fpk"
          FPK_ARM="m.text.editor-${VERSION}-arm.fpk"

          X86_SIZE=$(stat -c %s "$FPK_X86")
          ARM_SIZE=$(stat -c %s "$FPK_ARM")
          X86_SHA256=$(sha256sum "$FPK_X86" | awk '{print $1}')
          ARM_SHA256=$(sha256sum "$FPK_ARM" | awk '{print $1}')

          X86_URL="https://github.com/yuexps/m.text.editor/releases/download/${TAG_NAME}/${FPK_X86}"
          ARM_URL="https://github.com/yuexps/m.text.editor/releases/download/${TAG_NAME}/${FPK_ARM}"

          TARGET_REPOS=("yuexps/FnDepot")

          for REPO in "${TARGET_REPOS[@]}"; do
            REPO_DIR="repo_$(echo "$REPO" | tr '/' '_')"
            git clone "https://x-access-token:${FnDepot_TOKEN}@github.com/${REPO}.git" "$REPO_DIR" || continue
            pushd "$REPO_DIR" > /dev/null

            if [ -f "fnpack.json" ]; then
              jq --arg ver "$VERSION" \
                 --arg x86_url "$X86_URL" \
                 --arg x86_sha "$X86_SHA256" \
                 --argjson x86_size "$X86_SIZE" \
                 --arg arm_url "$ARM_URL" \
                 --arg arm_sha "$ARM_SHA256" \
                 --argjson arm_size "$ARM_SIZE" \
                 '
                 .apps["m.text.editor"].releases[$ver] = {
                   "packages": {
                     "x86": {
                       "download_url": $x86_url,
                       "sha256": $x86_sha,
                       "size": $x86_size
                     },
                     "arm": {
                       "download_url": $arm_url,
                       "sha256": $arm_sha,
                       "size": $arm_size
                     }
                   }
                 }
                 ' fnpack.json > fnpack.json.tmp && mv fnpack.json.tmp fnpack.json

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add fnpack.json
              if ! git diff --staged --quiet; then
                git commit -m "chore: bump m.text.editor to ${VERSION}"
                BRANCH=$(git rev-parse --abbrev-ref HEAD)
                git push "https://x-access-token:${FnDepot_TOKEN}@github.com/${REPO}.git" "$BRANCH"
              fi
            fi
            popd > /dev/null
          done
