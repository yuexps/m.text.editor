<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PodNote</title>
    <link rel="preload" href="./vs/loader.js" as="script">
    <link rel="preload" href="./vs/editor/editor.main.js" as="script">
    <link rel="preload" href="./vs/editor/editor.main.css" as="style">
    <link rel="icon" href="./images/ICON.PNG" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="vscode-layout">
        <!-- 顶栏 -->
        <header class="editor-header">
            <!-- 顶栏最左侧汉堡菜单 -->
            <div class="header-menu-container">
                <button id="activity-menu-btn" class="activity-btn" title="菜单">
                    <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M4 6h16"></path>
                            <path d="M4 12h16"></path>
                            <path d="M4 18h16"></path>
                        </g>
                    </svg>
                </button>
            </div>
            <!-- 左侧标签页 (动态生成) -->
            <div class="header-left">
                <button id="tab-scroll-left" class="tab-scroll-btn left" title="向左滚动" style="display: none;">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="tabs-row" id="tabs-row">
                </div>
                <button id="tab-scroll-right" class="tab-scroll-btn right" title="向右滚动" style="display: none;">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- 右侧：编辑与保存按钮 -->
            <div class="header-right">
                <button id="preview-mode-btn" class="text-link-btn" title="预览"
                    style="display: none; margin-right: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                        viewBox="0 0 24 24">
                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M7 15V9l2 2l2-2v6"></path>
                            <path d="M14 13l2 2l2-2m-2 2V9"></path>
                        </g>
                    </svg>
                </button>
                <button id="edit-mode-btn" class="text-link-btn" disabled
                    style="opacity: 0.3; pointer-events: none;">编辑</button>
                <button id="save-btn" class="action-btn" title="保存 (Ctrl+S)" disabled
                    style="opacity: 0.3; pointer-events: none;">保存</button>
            </div>
        </header>
        <!-- 主内容区 -->
        <main class="main-body">
            <!-- 工作台容器 (包含活动栏、侧边栏、编辑器区域) -->
            <div class="workbench">
                <!-- [1] 最左侧：活动栏 (Activity Bar) -->
                <nav class="activity-bar">
                    <div class="activity-top">
                        <button id="activity-explorer-btn" class="activity-btn" title="资源管理器">
                            <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M15 3v4a1 1 0 0 0 1 1h4"></path>
                                    <path d="M18 17h-7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4l5 5v7a2 2 0 0 1-2 2z"></path>
                                    <path d="M16 17v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2"></path>
                                </g>
                            </svg>
                        </button>
                        <button id="activity-search-btn" class="activity-btn" title="搜索">
                            <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M14 3v4a1 1 0 0 0 1 1h4"></path>
                                    <path d="M12 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v4.5"></path>
                                    <circle cx="16.5" cy="17.5" r="2.5"></circle>
                                    <path d="M18.5 19.5L21 22"></path>
                                </g>
                            </svg>
                        </button>
                        <button id="activity-terminal-btn" class="activity-btn" title="终端">
                            <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M8 9l3 3l-3 3"></path>
                                    <path d="M13 15h3"></path>
                                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                </g>
                            </svg>
                        </button>
                    </div>
                    <div class="activity-bottom">
                        <button id="activity-open-external-btn" class="activity-btn" title="在新标签页打开">
                            <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M18 19H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h5c.55 0 1-.45 1-1s-.45-1-1-1H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6c0-.55-.45-1-1-1s-1 .45-1 1v5c0 .55-.45 1-1 1zM14 4c0 .55.45 1 1 1h2.59l-9.13 9.13a.996.996 0 1 0 1.41 1.41L19 6.41V9c0 .55.45 1 1 1s1-.45 1-1V4c0-.55-.45-1-1-1h-5c-.55 0-1 .45-1 1z"
                                    fill="currentColor"></path>
                            </svg>
                        </button>
                        <button id="activity-settings-btn" class="activity-btn" title="设置">
                            <svg class="activity-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path
                                    d="M19.43 12.98c.04-.32.07-.64.07-.98c0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.566.566 0 0 0-.18-.03c-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98c0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03c.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zm-1.98-1.71c.04.31.05.52.05.73c0 .21-.02.43-.05.73l-.14 1.13l.89.7l1.08.84l-.7 1.21l-1.27-.51l-1.04-.42l-.9.68c-.43.32-.84.56-1.25.73l-1.06.43l-.16 1.13l-.2 1.35h-1.4l-.19-1.35l-.16-1.13l-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7l-1.06.43l-1.27.51l-.7-1.21l1.08-.84l.89-.7l-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13l-.89-.7l-1.08-.84l.7-1.21l1.27.51l1.04.42l.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43l.16-1.13l.2-1.35h1.39l.19 1.35l.16 1.13l1.06.43c.43.18.83.41 1.23.71l.91.7l1.06-.43l1.27-.51l.7 1.21l-1.07.85l-.89.7l.14 1.13zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4s-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2s2 .9 2 2s-.9 2-2 2z"
                                    fill="currentColor"></path>
                            </svg>
                        </button>
                    </div>
                </nav>

                <!-- [2] 中间：侧边栏 (Sidebar - 文件树与搜索) -->
                <aside id="sidebar" class="sidebar" style="width: 0px;">
                    <!-- 资源管理器面板 -->
                    <div id="sidebar-explorer" class="sidebar-panel">
                        <div class="sidebar-header">
                            <span class="sidebar-title">资源管理器</span>
                            <div class="sidebar-actions">
                                <button id="sidebar-new-file-btn" class="sidebar-action-btn" title="新建文件">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M14 3v4a1 1 0 0 0 1 1h4"></path>
                                            <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z">
                                            </path>
                                            <path d="M12 11v6"></path>
                                            <path d="M9 14h6"></path>
                                        </g>
                                    </svg>
                                </button>
                                <button id="refresh-tree-btn" class="sidebar-action-btn" title="刷新工作区">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                                        </g>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div id="file-tree" class="file-tree">
                            <!-- 文件树节点 -->
                            <div class="tree-empty-hint">工作区为空</div>
                        </div>
                    </div>

                    <!-- 搜索面板 -->
                    <div id="sidebar-search" class="sidebar-panel" style="display: none;">
                        <div class="sidebar-header">
                            <span class="sidebar-title">查找与替换</span>
                        </div>
                        <div class="sidebar-search-container">
                            <div class="search-form-group">
                                <div class="search-input-wrapper">
                                    <input type="text" id="sidebar-search-input" placeholder="查找文本..."
                                        autocomplete="off">
                                </div>
                                <div class="search-input-wrapper">
                                    <input type="text" id="sidebar-replace-input" placeholder="替换为..."
                                        autocomplete="off">
                                </div>
                            </div>
                            <div class="search-actions-bar">
                                <div class="search-nav-buttons">
                                    <button id="sidebar-search-prev-btn" class="search-nav-btn"
                                        title="上一个匹配 (Shift+F3)">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="18 15 12 9 6 15"></polyline>
                                        </svg>
                                    </button>
                                    <button id="sidebar-search-next-btn" class="search-nav-btn" title="下一个匹配 (F3)">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                            stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <div class="search-replace-buttons">
                                    <button id="sidebar-replace-btn" class="search-action-btn" title="替换">替换</button>
                                    <button id="sidebar-replace-all-btn" class="search-action-btn"
                                        title="全部替换">全部</button>
                                </div>
                            </div>
                            <div id="sidebar-search-results-info" class="search-results-info">无结果</div>
                            <div id="sidebar-search-results" class="search-results-list"></div>
                        </div>
                    </div>


                    <!-- 设置面板 -->
                    <div id="sidebar-settings" class="sidebar-panel" style="display: none;">
                        <div class="sidebar-header">
                            <span class="sidebar-title">设置</span>
                        </div>
                        <div class="sidebar-settings-container" id="sidebar-settings-form">
                            <!-- [A] 工作区设置 -->
                            <div class="settings-section">
                                <div class="settings-section-title">工作区</div>
                                <div class="settings-group">
                                    <label class="settings-label" for="settings-default-open-path">默认打开路径</label>
                                    <input type="text" id="settings-default-open-path" class="settings-control"
                                        placeholder="如: /vol1/1000/，留空不启用" autocomplete="off">
                                </div>
                                <div class="settings-group inline">
                                    <label class="settings-label" for="settings-pc-auto-edit">PC端自动切换编辑模式</label>
                                    <input type="checkbox" id="settings-pc-auto-edit" class="settings-checkbox">
                                </div>
                            </div>
                            <!-- [B] 编辑器设置 -->
                            <div class="settings-section">
                                <div class="settings-section-title">编辑器</div>
                                <div class="settings-group">
                                    <label class="settings-label" for="settings-font-size">字体大小</label>
                                    <select id="settings-font-size" class="settings-control">
                                        <option value="12">12 px</option>
                                        <option value="13">13 px</option>
                                        <option value="14">14 px</option>
                                        <option value="15">15 px</option>
                                        <option value="16">16 px</option>
                                        <option value="18">18 px</option>
                                        <option value="20">20 px</option>
                                        <option value="22">22 px</option>
                                    </select>
                                </div>
                                <div class="settings-group">
                                    <label class="settings-label" for="settings-font-family">字体类型</label>
                                    <select id="settings-font-family" class="settings-control">
                                        <option value="Consolas, 'Courier New', monospace">Consolas</option>
                                        <option value="'Fira Code', Consolas, monospace">Fira Code</option>
                                        <option value="'Courier New', Courier, monospace">Courier New</option>
                                    </select>
                                    <div class="settings-group inline">
                                        <label class="settings-label" for="settings-word-wrap">自动换行</label>
                                        <input type="checkbox" id="settings-word-wrap" class="settings-checkbox">
                                    </div>
                                    <div class="settings-group inline">
                                        <label class="settings-label" for="settings-minimap">显示小地图</label>
                                        <input type="checkbox" id="settings-minimap" class="settings-checkbox">
                                    </div>
                                    <div class="settings-group inline">
                                        <label class="settings-label" for="settings-read-only-tail">只读模式下启用 Tail</label>
                                        <input type="checkbox" id="settings-read-only-tail" class="settings-checkbox">
                                    </div>

                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-tab-size">缩进长度</label>
                                        <select id="settings-tab-size" class="settings-control">
                                            <option value="2">2 个空格</option>
                                            <option value="4">4 个空格</option>
                                            <option value="8">8 个空格</option>
                                        </select>
                                    </div>
                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-whitespace">渲染空白字符</label>
                                        <select id="settings-whitespace" class="settings-control">
                                            <option value="none">不显示</option>
                                            <option value="boundary">边界显示</option>
                                            <option value="all">显示全部</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- [C] 主题与换肤 -->
                                <div class="settings-section">
                                    <div class="settings-section-title">主题皮肤</div>
                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-editor-theme">代码主题</label>
                                        <select id="settings-editor-theme" class="settings-control">
                                            <option value="vs-dark">Dark (深色)</option>
                                            <option value="vs">Light (浅色)</option>
                                            <option value="hc-black">High Contrast (高对比度)</option>
                                        </select>
                                    </div>
                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-ui-theme">界面皮肤</label>
                                        <select id="settings-ui-theme" class="settings-control">
                                            <option value="dark">暗黑主题</option>
                                            <option value="light">明亮主题</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- [D] 终端 -->
                                <div class="settings-section">
                                    <div class="settings-section-title">终端 (Terminal)</div>
                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-terminal-font-size">终端字体大小</label>
                                        <select id="settings-terminal-font-size" class="settings-control">
                                            <option value="12">12 px</option>
                                            <option value="13">13 px</option>
                                            <option value="14">14 px</option>
                                            <option value="15">15 px</option>
                                            <option value="16">16 px</option>
                                        </select>
                                    </div>
                                    <div class="settings-group">
                                        <label class="settings-label"
                                            for="settings-terminal-cursor-style">终端光标样式</label>
                                        <select id="settings-terminal-cursor-style" class="settings-control">
                                            <option value="block">Block</option>
                                            <option value="bar">Bar</option>
                                        </select>
                                    </div>
                                    <div class="settings-group">
                                        <label class="settings-label" for="settings-terminal-user">默认执行用户</label>
                                        <select id="settings-terminal-user" class="settings-control">
                                            <option value="root">root</option>
                                            <option value="current">当前登录用户</option>
                                        </select>
                                    </div>
                                    <div class="settings-group inline">
                                        <label class="settings-label" for="settings-terminal-cursor-blink">光标闪烁</label>
                                        <input type="checkbox" id="settings-terminal-cursor-blink"
                                            class="settings-checkbox">
                                    </div>
                                </div>

                            </div>
                        </div>
                </aside>

                <!-- [3] 拖动条 (Sidebar Resizer) -->
                <div id="sidebar-resizer" class="sidebar-resizer"></div>

                <!-- 窄屏抽屉遮罩层 -->
                <div id="sidebar-overlay" class="sidebar-overlay" style="display: none;"></div>

                <!-- [4] 右侧：编辑主区 (Editor Area) -->
                <div class="editor-area">
                    <!-- 主工作区，支持双栏分屏 -->
                    <div class="editor-workspace-wrapper">
                        <!-- 编辑器容器 -->
                        <div id="editor-container" tabindex="0"></div>
                        <!-- 欢迎页容器 (主页) -->
                        <div id="welcome-overlay" style="display: none;">
                            <div class="welcome-card">
                                <div class="welcome-icon">PodNote</div>
                                <div class="welcome-title">基于 Monaco Editor 编辑器</div>
                                <div class="welcome-desc">轻量、极速的文本编辑器。</div>
                                <div class="welcome-main-hint">请从 FNOS 文件管理 中打开文件</div>
                                <div class="welcome-input-area">
                                    <div class="welcome-divider"><span>或者手动输入路径</span></div>
                                    <div class="input-group">
                                        <input type="text" id="manual-path-input" placeholder="输入文件或文件夹绝对路径 (如/etc)"
                                            autocomplete="off">
                                    </div>
                                    <div class="welcome-buttons">
                                        <button id="open-path-btn" class="welcome-btn main">打开路径</button>
                                        <button id="create-path-btn" class="welcome-btn secondary">新建文件</button>
                                    </div>
                                    <a id="install-ext-btn"
                                        href="https://microsoftedge.microsoft.com/addons/detail/ecgbblpdmcifphblcegckelcdhpghjge"
                                        target="_blank" style="display: none;">
                                        安装 PodNote 浏览器拓展
                                    </a>
                                </div>
                            </div>
                        </div>
                        <!-- Markdown 预览容器 -->
                        <div id="markdown-preview-container" class="markdown-preview-container" style="display: none;">
                            <div id="markdown-preview-body" class="markdown-body"></div>
                        </div>
                        <!-- 通用文件预览容器 -->
                        <div id="file-preview-container" class="file-preview-container" style="display: none;"></div>
                    </div>

                    <!-- 底部面板 -->
                    <div id="bottom-panel" class="bottom-panel" style="display: none; height: 400px;">
                        <!-- 顶部拖拽条 -->
                        <div id="panel-resizer" class="panel-resizer"></div>
                        <div class="panel-header">
                            <div class="panel-tabs">
                                <button id="panel-tab-problems" class="panel-tab active">问题</button>
                                <button id="panel-tab-terminal" class="panel-tab">终端</button>
                            </div>
                            <div class="panel-actions">
                                <button id="panel-terminal-restart-btn" class="panel-action-btn" title="重连终端" style="display: none;">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
                                        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round">
                                            <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"></path>
                                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"></path>
                                        </g>
                                    </svg>
                                </button>
                                <button id="close-panel-btn" title="关闭面板">×</button>
                            </div>
                        </div>
                        <div class="panel-body" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                            <div id="problems-list" class="problems-list"></div>
                            <div id="terminal-panel-container" class="terminal-body-container" style="display: none; width: 100%; height: 100%;">
                                <div id="terminal-container"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 语言选择面板 -->
                <div id="lang-panel" class="lang-panel" style="display: none;">
                    <div class="lang-panel-header">选择语言模式</div>
                    <div class="lang-list" id="lang-list"></div>
                </div>

                <!-- 编码选择面板 -->
                <div id="encoding-panel" class="lang-panel" style="display: none;">
                    <div class="lang-panel-header">选择文件编码</div>
                    <div class="lang-list" id="encoding-list"></div>
                </div>

                <!-- 换行符选择面板 -->
                <div id="eol-panel" class="lang-panel" style="display: none;">
                    <div class="lang-panel-header">选择行尾序列</div>
                    <div class="lang-list" id="eol-list"></div>
                </div>
            </div>

            <!-- 状态栏 -->
            <footer class="status-bar">
                <div class="status-left">
                    <div id="status-problems" class="status-problems">
                        <span class="problem-item error">
                            <svg viewBox="0 0 16 16" width="14" height="14">
                                <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"
                                    d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1a6 6 0 1 1 0 12A6 6 0 0 1 8 2zM10.35 5.65L11.06 6.36 8.71 8.71 11.06 11.06 10.35 11.77 8 9.41 5.65 11.77 4.94 11.06 7.29 8.71 4.94 6.36 5.65 5.65 8 8 10.35 5.65z" />
                            </svg>
                            <span id="error-count">0</span>
                        </span>
                        <span class="problem-item warning">
                            <svg viewBox="0 0 16 16" width="14" height="14">
                                <path fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"
                                    d="M7.56 1.18a1 1 0 0 1 1.74 0L15.3 12.31a1 1 0 0 1-.87 1.49H2.43a1 1 0 0 1-.87-1.49L7.56 1.18zM2.43 12.8h12L8.43 2.18l-6 10.62zM8 11.2a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6zM7.2 9.6h1.6V5.6H7.2v4z" />
                            </svg>
                            <span id="warning-count">0</span>
                        </span>
                    </div>
                    <span id="status-text">准备就绪</span>
                </div>
                <div class="status-center">
                    <nav class="status-breadcrumbs" id="breadcrumbs">
                        <!-- 路径将在这里显示 -->
                    </nav>
                </div>
                <div class="status-right">
                    <span id="char-count" class="status-item">0 字符</span>
                    <span id="pos-display" class="status-item">行 1，列 1</span>
                    <span id="eol-selector" class="status-item clickable disabled">LF</span>
                    <span id="lang-selector" class="status-item clickable disabled">Plain Text</span>
                    <span id="encoding-selector" class="status-item clickable disabled">UTF-8</span>
                </div>
            </footer>
        </main>
    </div>
    <div id="toast"></div>

    <!-- 自定义确认弹窗 Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header" id="confirm-modal-header"></div>
            <div class="modal-body" id="confirm-modal-message"></div>
            <input type="text" id="confirm-modal-input" class="modal-input" autocomplete="off" style="display: none;">
            <div class="modal-footer">
                <button id="confirm-modal-cancel" class="modal-btn secondary">取消</button>
                <button id="confirm-modal-ok" class="modal-btn primary">确定</button>
            </div>
        </div>
    </div>

    <!-- 汉堡菜单下拉面板 -->
    <div id="activity-dropdown-menu" class="activity-dropdown-menu" style="display: none;">
        <div class="menu-item disabled" id="menu-undo" data-action="undo">
            <span class="menu-item-label">撤销</span>
            <span class="menu-item-key">Ctrl+Z</span>
        </div>
        <div class="menu-item disabled" id="menu-redo" data-action="redo">
            <span class="menu-item-label">恢复</span>
            <span class="menu-item-key">Ctrl+Y</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item disabled" id="menu-copy" data-action="copy">
            <span class="menu-item-label">复制</span>
            <span class="menu-item-key">Ctrl+C</span>
        </div>
        <div class="menu-item disabled" id="menu-paste" data-action="paste">
            <span class="menu-item-label">粘贴</span>
            <span class="menu-item-key">Ctrl+V</span>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item disabled" id="menu-find" data-action="find">
            <span class="menu-item-label">查找</span>
            <span class="menu-item-key">Ctrl+F</span>
        </div>
        <div class="menu-item disabled" id="menu-replace" data-action="replace">
            <span class="menu-item-label">替换</span>
            <span class="menu-item-key">Ctrl+H</span>
        </div>
    </div>

    <script>
        // 解析路径并预取文件内容
        (function () {
            const params = new URLSearchParams(window.location.search);
            window.currentPath = params.get('path') || '';
            window.currentEncoding = params.get('encoding') || 'utf-8';

            if (window.currentPath) {
                console.log('[Preload] 发起文件预加载:', window.currentPath);
                window.filePreloadPromise = fetch(`./api/read?path=${encodeURIComponent(window.currentPath)}&encoding=${window.currentEncoding}`)
                    .then(res => {
                        return res.json();
                    })
                    .then(data => {
                        console.log('[Preload] 数据预加载完成');
                        return data;
                    })
                    .catch(err => {
                        console.error('[Preload] 预加载失败:', err);
                        return { error: err.message };
                    });
            } else {
                console.log('[Preload] 无需加载文件，初始化为空 Promise');
                window.filePreloadPromise = Promise.resolve(null);
            }
        })();

        // 向父级注入控制脚本 (用于 FNOS 文件管理交互)
        (function () {
            let installed = false;
            try {
                if (window.parent && window.parent !== window) {
                    // 如果已经安装并运行了浏览器拓展，则跳过注入
                    if (window.parent.__PODNOTE_EXTENSION_INSTALLED__ || window.parent.__NOTEPOD_EXTENSION_INSTALLED__) {
                        console.log('%c[PodNote] 检测到浏览器拓展已安装，跳过内置脚本注入', 'color: #FF9800; font-weight: bold;');
                        installed = true;
                    } else {
                        const scriptId = 'podnote-fnos-inject';
                        if (!window.parent.document.getElementById(scriptId)) {
                            const script = window.parent.document.createElement('script');
                            script.id = scriptId;
                            script.src = '/app/m-text-editor/plugins/inject_fnos.js';
                            window.parent.document.head.appendChild(script);
                            console.log('%c[PodNote] 已尝试向父级注入文件管理插件', 'color: #4CAF50; font-weight: bold;');
                        }
                    }
                } else {
                    if (window.__PODNOTE_EXTENSION_INSTALLED__ || window.__NOTEPOD_EXTENSION_INSTALLED__) {
                        installed = true;
                    }
                }
            } catch (e) {
                console.warn('%c[PodNote] 自动注入文件管理插件受阻 (可能是跨域或权限原因): %c', 'color: #FF9800; font-weight: bold;', e);
            }

            if (!installed) {
                const isPC = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const isChromeBased = /Chrome|Chromium|Edg/i.test(navigator.userAgent);
                if (isPC && isChromeBased) {
                    const btn = document.getElementById('install-ext-btn');
                    if (btn) btn.style.display = 'flex';
                }
            }
        })();
    </script>
    <script src="./vs/loader.js"></script>
    <!-- 应用逻辑 -->
    <script type="module" src="app.js"></script>
</body>

</html>
